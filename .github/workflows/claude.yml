name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true # data/*.csv are Git LFS files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Add ONE of these secrets in Settings > Secrets and variables > Actions.
          # Pro/Max plan: run `claude setup-token` locally and store it as CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API billing instead: comment the line above and uncomment this one.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # DFT and full ML runs need the cluster; the runner only installs deps and runs light checks.
          # Skills in .claude/skills load automatically; MCP servers are listed in .github/claude-mcp.json.
          claude_args: |
            --mcp-config .github/claude-mcp.json
            --allowedTools "Skill,mcp__context7,mcp__exa,Bash(pip install:*),Bash(python:*),Bash(pytest:*),Bash(flake8:*),Bash(black:*)"
