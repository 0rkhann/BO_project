name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/agent')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/agent')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '/agent')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '/agent') || contains(github.event.issue.title, '/agent')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true # data/*.csv are Git LFS files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Add ONE of these secrets in Settings > Secrets and variables > Actions.
          # Pro/Max plan: run `claude setup-token` locally and store it as CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Neutral trigger and branch names: the author does not want the tool named in the repo.
          trigger_phrase: "/agent"
          branch_prefix: "agent/"
          # API billing instead: comment the line above and uncomment this one.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Pinned superpowers plugin from the local marketplace in claude-plugins/.
          plugin_marketplaces: ./claude-plugins
          plugins: superpowers@bo-project

          # DFT and full ML runs need the cluster; the runner only installs deps and runs light checks.
          # Skills in .claude/skills load automatically.
          # The MCP config must be inline JSON: the action merges inline configs with its own
          # GitHub servers but drops a file path when it adds its own config.
          # The appended prompt turns skill approval gates into comment-and-resume: Claude posts its
          # questions and ends the run, and the author answers in a new /agent comment.
          # Playwright (pinned, uses the runner's preinstalled Chrome) can only open GitHub pages and a
          # local preview server on port 8000, e.g. `python -m http.server 8000`, to check how pages look.
          claude_args: |
            --append-system-prompt "You run in GitHub Actions and the author cannot reply during this run. When a skill such as brainstorming or writing-plans needs the author to answer questions or approve a design or plan, do not guess the answer and do not wait. Post the questions or the proposal in your comment, clearly listed, then end the run without implementing the unapproved part. The author will answer in a new /agent comment, and you will continue from the thread. Work that needs no approval can be finished in the same run. Never mention Claude, Claude Code or Anthropic in commit messages, pull request titles or descriptions, code comments or repository files, and do not add Co-Authored-By or Generated-with lines."
            --mcp-config '{"mcpServers":{"context7":{"type":"http","url":"https://mcp.context7.com/mcp"},"exa":{"type":"http","url":"https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa"},"playwright":{"command":"npx","args":["-y","@playwright/mcp@0.0.83","--headless","--browser","chrome","--isolated","--allowed-origins","https://github.com;https://raw.githubusercontent.com;https://github.githubassets.com;https://avatars.githubusercontent.com;https://camo.githubusercontent.com;http://localhost:8000"]}}}'
            --allowedTools "Skill,mcp__context7,mcp__exa,mcp__playwright,Bash(pip install:*),Bash(python:*),Bash(pytest:*),Bash(flake8:*),Bash(black:*)"
