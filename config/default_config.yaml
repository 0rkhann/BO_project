# Default configuration for Bayesian Optimization

# Data settings
data:
  descriptor_file: "data/mordred.csv"
  cache_file: "data/energy_cache.json"
  test_frac: 0.05
  n_initial: 10

# BO settings
optimization:
  method: "vanilla"  # one of: ["vanilla", "fabo", "pls", "pca", "opls"]
  kernel: "matern"   # one of: ["matern", "rbf", "rq"]
  acquisition: "ei"  # one of: ["ei", "pi", "ucb"]
  n_iter: 100
  beta: 1.0         # for UCB acquisition
  batch_size: 1     # >1 for batch optimization

# Feature selection settings
feature_selection:
  # PCA settings (adaptive)
  pca_components: null  # null = auto-select, or specify fixed number
  pca_max_components: 20  # Maximum components to consider (reduced from 50)
  pca_min_components: 5   # Minimum components to select (reduced from 10)
  pca_explained_variance_threshold: 0.90  # Minimum explained variance (reduced from 0.95)
  pca_cv_folds: 5  # Cross-validation folds for PCA
  
  # PLS settings
  pls_max_components: 20  # Maximum components to try (increased from 8)
  pls_min_components: 3   # Minimum components (prevents too few)
  pls_cv_folds: 5         # Cross-validation folds for PLS
  
  # OPLS settings
  opls_max_predictive: 15  # Maximum predictive components (increased from 3)
  opls_max_orthogonal: 5   # Maximum orthogonal components (increased from 1)
  opls_min_predictive: 2   # Minimum predictive components
  opls_cv_folds: 5         # Cross-validation folds for OPLS
  
  # FABO settings (now adaptive)
  fabo_k: null  # null = auto-select, or specify fixed number
  fabo_threshold: null  # null = auto-select, or specify correlation threshold
  fabo_max_features: 20  # Maximum features to consider (reduced from 100)
  fabo_min_features: 5  # Minimum features to select (prevents too aggressive selection)
  fabo_min_correlation: 0.05  # Minimum correlation threshold (reduced from 0.1 to be less aggressive)
  fabo_cv_folds: 5  # Cross-validation folds for FABO

# Early stopping settings
early_stopping:
  enabled: false
  patience: 10
  min_delta: 1.0e-4
  min_iterations: 20
  window_size: 10

# Training settings
training:
  lr: 0.1           # Initial learning rate for GP optimization
  maxiter: 20       # Maximum iterations per restart (reduced for faster execution)
  n_restarts: 3     # Number of random restarts for GP optimization
  patience: 20      # Patience for LR scheduler (ReduceLROnPlateau)

# ML model settings
ml_models:
  test_size: 0.2
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "auto"
  
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
  
  neural_network:
    hidden_dims: [256, 128, 64]
    dropout: 0.1
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 1.0e-5
    n_epochs: 100
    patience: 10

# Output settings
output:
  results_dir: "results"
  save_models: true
  save_predictions: true

# Random seed
random_state: 42